<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">BuildSOM AI 可见度监测链路</title>
  <desc id="desc">从品牌项目、监测提示词、AI 平台采集到指标看板和优化动作的流程图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="52%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#f7f7ff"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#475569" flood-opacity="0.14"/>
    </filter>
    <style>
      .title{font:700 34px "Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 18px "Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#475569}
      .card-title{font:700 22px "Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#111827}
      .body{font:400 15px "Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#475569}
      .tag{font:600 13px "Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#334155}
      .small{font:500 12px "Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#64748b}
      .dark-tag{font:600 13px "Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#cbd5e1}
      .dark-body{font:400 15px "Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#e2e8f0}
      .dark-small{font:500 12px "Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#cbd5e1}
    </style>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <circle cx="1025" cy="110" r="135" fill="#dbeafe" opacity=".55"/>
  <circle cx="160" cy="590" r="160" fill="#ede9fe" opacity=".55"/>

  <text x="72" y="78" class="title">BuildSOM 的 AI 可见度监测链路</text>
  <text x="72" y="112" class="subtitle">把“用户会怎样问 AI”变成可追踪、可对比、可复盘的品牌数据</text>

  <g filter="url(#softShadow)">
    <rect x="72" y="178" width="214" height="230" rx="22" fill="#ffffff"/>
    <rect x="92" y="198" width="52" height="52" rx="16" fill="#eff6ff"/>
    <path d="M112 224h26M112 214h19M112 234h14" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <text x="92" y="286" class="card-title">1. 建项目</text>
    <text x="92" y="324" class="body">品牌名 / 别名</text>
    <text x="92" y="352" class="body">官网域名 / 伙伴域名</text>
    <text x="92" y="380" class="body">竞品与行业语境</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="358" y="178" width="214" height="230" rx="22" fill="#ffffff"/>
    <rect x="378" y="198" width="52" height="52" rx="16" fill="#f5f3ff"/>
    <path d="M392 220h24M392 234h38M430 206v38" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
    <text x="378" y="286" class="card-title">2. 设提示词</text>
    <text x="378" y="324" class="body">用户问题与购买意图</text>
    <text x="378" y="352" class="body">地区 / 语言 / 平台</text>
    <text x="378" y="380" class="body">按天自动采集结果</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="644" y="178" width="214" height="230" rx="22" fill="#ffffff"/>
    <rect x="664" y="198" width="52" height="52" rx="16" fill="#eef2ff"/>
    <circle cx="690" cy="224" r="16" fill="none" stroke="#4f46e5" stroke-width="4"/>
    <path d="M706 240l18 18" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
    <text x="664" y="286" class="card-title">3. 解析回答</text>
    <text x="664" y="324" class="body">品牌是否出现</text>
    <text x="664" y="352" class="body">排名位置与语义倾向</text>
    <text x="664" y="380" class="body">引用 URL 与来源分类</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="930" y="178" width="214" height="230" rx="22" fill="#ffffff"/>
    <rect x="950" y="198" width="52" height="52" rx="16" fill="#ecfeff"/>
    <path d="M964 238v-18M978 238v-30M992 238v-10" stroke="#0891b2" stroke-width="6" stroke-linecap="round"/>
    <text x="950" y="286" class="card-title">4. 看指标</text>
    <text x="950" y="324" class="body">GEO Impact Score</text>
    <text x="950" y="352" class="body">Brand Coverage / SOV</text>
    <text x="950" y="380" class="body">Avg. Position / Citation</text>
  </g>

  <path d="M292 292h58" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M340 280l14 12-14 12" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M578 292h58" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M626 280l14 12-14 12" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M864 292h58" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M912 280l14 12-14 12" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(110 495)">
    <rect width="980" height="92" rx="24" fill="#0f172a"/>
    <rect x="24" y="23" width="46" height="46" rx="14" fill="url(#primary)"/>
    <path d="M38 49h18M47 40v18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="92" y="38" class="dark-tag">最终产出</text>
    <text x="92" y="66" class="dark-body">内容缺口、竞品差距、引用来源、地区差异和可执行的 GEO 优化优先级</text>
    <g transform="translate(715 20)">
      <rect width="222" height="52" rx="16" fill="#ffffff" opacity=".08"/>
      <text x="20" y="32" class="dark-small">从“感觉被提到”到“知道怎么变好”</text>
    </g>
  </g>
</svg>
